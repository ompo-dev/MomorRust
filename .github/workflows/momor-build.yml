name: Build Momor

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: momor-linux-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: momor-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: momor-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash script/linux

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux C++ wrapper
        if: runner.os == 'Linux'
        run: |
          cat > /tmp/c++-wrapper << 'WRAPPER'
          #!/bin/bash
          args=()
          for a in "$@"; do
            [[ "$a" != "-Wno-changes-meaning" ]] && args+=("$a")
          done
          exec /usr/bin/c++ -fpermissive "${args[@]}"
          WRAPPER
          chmod +x /tmp/c++-wrapper

      - name: Build Momor on Linux
        if: runner.os == 'Linux'
        env:
          CXX: /tmp/c++-wrapper
        run: cargo build --release --locked --bin momor

      - name: Build Momor on macOS
        if: runner.os == 'macOS'
        run: cargo build --release --locked --bin momor

      - name: Build Momor on Windows
        if: runner.os == 'Windows'
        env:
          CARGO_HOME: "C:\\c"
        run: cargo build --release --locked --bin momor

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.artifact }}" -C target/release momor

      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/momor.exe -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
