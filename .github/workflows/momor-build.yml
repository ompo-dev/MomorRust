name: Build Momor

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build Windows
    runs-on: windows-latest
    env:
      CARGO_HOME: "C:\\c"

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build Momor on Windows
        run: cargo build --release --locked --bin momor

      - name: Package Windows binary
        run: |
          $packageFiles = @('target/release/momor.exe')
          foreach ($companion in @('target/release/conpty.dll', 'target/release/OpenConsole.exe')) {
            if (Test-Path -LiteralPath $companion -PathType Leaf) {
              $packageFiles += $companion
            }
          }
          Compress-Archive -LiteralPath $packageFiles -DestinationPath momor-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: momor-windows-x86_64.zip
          path: momor-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
