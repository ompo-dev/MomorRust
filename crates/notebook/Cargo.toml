# ponytail: workspace "Notion" — pastas, notas e reuniões (transcrições) persistidas
[package]
name = "notebook"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/notebook.rs"
doctest = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
db.workspace = true
editor.workspace = true
# Avaliador de expressões p/ blocos de gráfico (```plot). Puro Rust, sem deps pesadas.
fasteval = "0.2"
# Equações LaTeX → SVG (```math), via MathJax embutido. Offline.
mathjax_svg = "3"
gpui.workspace = true
language.workspace = true
# Render de markdown (WYSIWYG dos parágrafos fora de foco) — o mesmo do chat.
markdown.workspace = true
paths.workspace = true
project.workspace = true
rope.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
settings.workspace = true
sqlez.workspace = true
text.workspace = true
theme_settings.workspace = true
stt.workspace = true
ui.workspace = true
ui_input.workspace = true
util.workspace = true
uuid.workspace = true
workspace.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
